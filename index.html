<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Porra del Trabajo</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0b0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Porra" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0e14;
    --bg2:#0f1420;
    --card:#141a27;
    --card-border:#232b3d;
    --text:#eef1f8;
    --text-dim:#95a0b8;
    --accent1:#8b5cf6;
    --accent2:#22d3ee;
    --accent3:#fb7185;
    --accent4:#facc15;
    --ok:#2dd4bf;
    --danger:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.25), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(34,211,238,.18), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px;}
  @media (min-width:760px){ .wrap{max-width:880px;} }
  h1,h2,h3{margin:0 0 4px;font-weight:700;letter-spacing:-.01em;}
  .muted{color:var(--text-dim);}
  .center{text-align:center;}
  .row{display:flex;gap:10px;align-items:center;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)) , var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .brand{
    font-weight:800;
    font-size:26px;
    letter-spacing:.2px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2) 60%, var(--accent3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .input{
    width:100%;
    background:#0d1220;
    border:1px solid var(--card-border);
    color:var(--text);
    border-radius:12px;
    padding:12px 14px;
    font-size:16px;
    outline:none;
  }
  .input:focus{border-color:var(--accent2);}
  label{font-size:13px;color:var(--text-dim);display:block;margin:10px 0 6px;}
  .btn{
    border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;
    cursor:pointer;color:var(--text);background:#1b2334;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    color:#0a0f1a;
  }
  .btn-warn{background:linear-gradient(90deg,var(--accent4),var(--accent3));color:#1a0f0f;}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 10px;font-size:13px;border-radius:10px;}
  .tabs{
    display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;margin-bottom:14px;
  }
  .tab{
    flex:0 0 auto;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;
    background:#111827;border:1px solid var(--card-border);color:var(--text-dim);cursor:pointer;white-space:nowrap;
  }
  .tab.active{
    background:linear-gradient(90deg,var(--accent1),var(--accent3));
    color:#0a0f1a;border-color:transparent;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:44px;font-size:11px;font-weight:700;letter-spacing:.03em;
    flex:0 0 auto; box-shadow:0 3px 10px rgba(0,0,0,.4);
    clip-path:polygon(50% 0%,93% 14%,93% 58%,50% 100%,7% 58%,7% 14%);
    position:relative;
  }
  .badge::after{
    content:'';position:absolute;inset:2px;
    clip-path:polygon(50% 0%,93% 14%,93% 58%,50% 100%,7% 58%,7% 14%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    pointer-events:none;
  }
  .badge.lg{width:58px;height:66px;font-size:15px;}
  .badge-img{width:38px;height:38px;object-fit:contain;flex:0 0 auto;}
  .badge-img.lg{width:56px;height:56px;}
  .match{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    border:1px solid var(--card-border);border-radius:18px;padding:16px 10px;
  }
  .match .team{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:0;}
  .match .team-top{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#0d1220;border:1px solid var(--card-border);border-radius:14px;
    padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3);min-height:64px;width:100%;
  }
  .match .team-top.reverse{flex-direction:row-reverse;}
  .match .team-top .badge-img{width:52px;height:52px;}
  .match .team-top .badge{width:46px;height:52px;}
  .match .team-name{
    font-size:15px;font-weight:700;text-align:center;color:var(--text);line-height:1.25;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .match .team-top input{
    width:52px;height:52px;text-align:center;font-size:24px;font-weight:800;padding:0;
    background:#161d2e;border:1px solid var(--card-border);border-radius:10px;color:var(--accent2);
  }
  .match .team-top .score-locked{
    width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;
    background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.4);border-radius:10px;color:var(--ok);
  }
  .vs-col{display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0 4px;}
  .vs-col .vs{
    display:flex;align-items:center;justify-content:center;min-width:42px;height:42px;padding:0 10px;
    border-radius:999px;background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#0a0f1a;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(139,92,246,.35);
  }
  .score-inputs{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;}
  .score-inputs input{
    width:56px;text-align:center;font-size:20px;font-weight:800;padding:10px 0;
    background:#0d1220;border:1px solid var(--card-border);border-radius:10px;color:var(--text);
  }
  .score-inputs .dash{font-size:20px;font-weight:800;color:var(--text-dim);}
  table{width:100%;border-collapse:collapse;font-size:15px;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--card-border);}
  th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  td.num, th.num{text-align:center;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;}
  .pill.ok{background:rgba(45,212,191,.15);color:var(--ok);}
  .pill.no{background:rgba(248,113,113,.12);color:var(--danger);}
  .pill.win{background:linear-gradient(90deg,var(--accent4),var(--accent3));color:#1a0f0f;}
  .hidden{display:none !important;}
  .toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    background:#141a27;border:1px solid var(--card-border);color:var(--text);
    padding:12px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .modal{
    position:fixed;inset:0;background:rgba(5,7,12,.72);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{
    background:#141a27;border:1px solid var(--card-border);border-radius:16px;
    padding:20px;max-width:360px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .cred-content{margin-top:8px;font-size:15px;line-height:1.6;}
  .cred-content .cred-line{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#0d1220;border:1px solid var(--card-border);border-radius:10px;
    padding:10px 12px;margin-top:8px;font-weight:700;
  }
  .cred-content .cred-value{color:var(--accent2);font-size:16px;letter-spacing:.02em;user-select:all;}
  select.input{-webkit-appearance:none;appearance:none;}
  .divider{height:1px;background:var(--card-border);margin:14px 0;}
  .checkbox{width:22px;height:22px;accent-color:var(--accent2);}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));font-weight:800;color:#0a0f1a;font-size:14px;
  }
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
  .small{font-size:12px;}
  .section-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .dot{width:8px;height:8px;border-radius:50%;}
</style>
</head>
<body>

<div class="wrap" id="login-view">
  <div style="padding-top:14vh;">
    <div class="center" style="margin-bottom:26px;">
      <div class="brand">⚽ Porra del Trabajo</div>
      <div class="muted small">Dos partidos por jornada. El que clava los dos, gana.</div>
    </div>
    <div class="card">
      <label>Tu ID</label>
      <input class="input" id="login-id" autocomplete="username" placeholder="p.ej. carlo" />
      <label>Contraseña</label>
      <input class="input" id="login-pass" type="password" autocomplete="current-password" placeholder="••••••" />
      <div class="err" id="login-err"></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="doLogin()">Entrar</button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="app-view">
  <div class="topbar">
    <div class="row">
      <div class="avatar" id="me-avatar">?</div>
      <div>
        <div style="font-weight:800;" id="me-nombre">—</div>
        <div class="muted small" id="me-role">—</div>
      </div>
    </div>
    <button class="btn btn-sm" onclick="doLogout()">Salir</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="tab-jornada"></div>
  <div id="tab-clasificacion" class="hidden"></div>
  <div id="tab-historial" class="hidden"></div>
  <div id="tab-secretaria" class="hidden"></div>
  <div id="tab-contabilidad" class="hidden"></div>
  <div id="tab-admin" class="hidden"></div>

  <div class="small muted center" style="margin-top:28px;opacity:.5;">Versión 2026-09-12-1</div>
</div>

<div id="toast" class="toast hidden"></div>

<div id="cred-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Credenciales</h3>
    <div id="cred-content" class="cred-content"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="closeCredModal()">Cerrar, ya la he apuntado</button>
  </div>
</div>

<script>
const SESSION_KEY = 'porra_trabajo_session_v1';
let session = null;
let state = null;
let currentTab = 'jornada';
let autoRefreshTimer = null;

function getSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; }
}
function setSession(s){
  session = s;
  if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else localStorage.removeItem(SESSION_KEY);
}

function showCredModal(nombre, id, pass){
  document.getElementById('cred-content').innerHTML = `
    <div>Participante: <strong>${nombre}</strong></div>
    <div class="cred-line"><span>ID</span><span class="cred-value">${id}</span></div>
    <div class="cred-line"><span>Contraseña</span><span class="cred-value">${pass}</span></div>
    <div class="small muted" style="margin-top:10px;">Apúntala ahora, no se puede volver a ver (pero puedes generar una nueva desde "Restablecer contraseña").</div>
  `;
  document.getElementById('cred-modal').classList.remove('hidden');
}
function closeCredModal(){
  document.getElementById('cred-modal').classList.add('hidden');
}

function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.add('hidden'), ms || 2600);
}

async function api(path, opts){
  opts = Object.assign({ cache: 'no-store' }, opts || {});
  const res = await fetch(path, opts);
  let data;
  try { data = await res.json(); } catch(e){ data = { ok:false, error:'respuesta_invalida' }; }
  return data;
}

async function doLogin(){
  const id = document.getElementById('login-id').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  if (!id || !pass){ err.textContent = 'Rellena tu ID y contraseña.'; return; }
  const data = await api('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id, pass })
  });
  if (!data.ok){ err.textContent = 'ID o contraseña incorrectos.'; return; }
  setSession({ id, pass, nombre: data.participante.nombre, role: data.participante.role, esSecretario: data.participante.esSecretario });
  await boot();
}

function doLogout(){
  stopAutoRefresh();
  setSession(null);
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('login-id').value = '';
  document.getElementById('login-pass').value = '';
}

function initials(nombre){
  return String(nombre).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function teamBadge(teamId, size){
  const eq = (state.equipos || []).find(e => e.id === teamId);
  if (!eq) return '<span class="badge">?</span>';
  return `<img src="/escudos/${eq.id}.png" alt="${eq.nombre}" title="${eq.nombre}" class="badge-img ${size==='lg'?'lg':''}" onerror="badgeImgError(this,'${eq.id}','${size||''}')">`;
}
function badgeImgError(img, teamId, size){
  const eq = (state.equipos || []).find(e => e.id === teamId);
  if (!eq) { img.remove(); return; }
  const span = document.createElement('span');
  span.className = 'badge' + (size==='lg' ? ' lg' : '');
  span.style.background = `linear-gradient(135deg, ${eq.color1}, ${eq.color2})`;
  span.style.color = textOn(eq.color1);
  span.title = eq.nombre;
  span.textContent = eq.corto;
  img.replaceWith(span);
}
function teamName(teamId){
  const eq = (state.equipos || []).find(e => e.id === teamId);
  if (!eq) return teamId;
  // si el nombre completo es largo, usamos las 3 letras para que las dos
  // columnas del partido queden siempre alineadas a la misma altura.
  return eq.nombre.length > 15 ? eq.corto.toUpperCase() : eq.nombre;
}
function matchLabel(partido){
  const l = (state.equipos || []).find(e => e.id === partido.local);
  const v = (state.equipos || []).find(e => e.id === partido.visitante);
  return `${l ? l.corto : partido.local}-${v ? v.corto : partido.visitante}`;
}
function textOn(hex){
  // negro o blanco según el brillo del color de fondo
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const yiq = (r*299+g*587+b*114)/1000;
  return yiq >= 150 ? '#10131b' : '#ffffff';
}

function matchCard(partido, opts){
  opts = opts || {};
  const input = (id, val) => `<input type="number" min="0" max="20" inputmode="numeric" id="${id}" value="${val||''}" />`;
  const locked = (val) => `<div class="score-locked">${val!==undefined && val!=='' ? val : '—'}</div>`;
  const side = (key) => {
    if (opts.ids) return input(opts.ids[key], opts.vals && opts.vals[key]);
    if (opts.locked) return locked(opts.locked[key]);
    return '';
  };
  const team = (teamId, key) => `
    <div class="team">
      <div class="team-top${key==='visit' ? ' reverse' : ''}">
        ${teamBadge(teamId,'lg')}
        ${side(key)}
      </div>
      <span class="team-name">${teamName(teamId)}</span>
    </div>`;
  return `
    <div class="match">
      ${team(partido.local, 'local')}
      <div class="vs-col"><span class="vs">${partido.resultado ? partido.resultado : 'VS'}</span></div>
      ${team(partido.visitante, 'visit')}
    </div>`;
}

function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['jornada','clasificacion','historial','secretaria','contabilidad','admin'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
  });
}

function buildTabs(){
  const tabs = [{k:'jornada', label:'Jornada actual'}, {k:'clasificacion', label:'Clasificación'}, {k:'historial', label:'Historial'}];
  if (session.esSecretario || session.role === 'admin') tabs.push({k:'secretaria', label:'💶 Secretaría'});
  if (session.esSecretario || session.role === 'admin') tabs.push({k:'contabilidad', label:'📒 Contabilidad'});
  if (session.role === 'admin') tabs.push({k:'admin', label:'⚙️ Admin'});
  const el = document.getElementById('tabs');
  el.innerHTML = tabs.map(t => `<div class="tab" data-tab="${t.k}" onclick="setTab('${t.k}')">${t.label}</div>`).join('');
  setTab(currentTab);
}

async function loadState(){
  const data = await api(`/api/state?id=${encodeURIComponent(session.id)}&pass=${encodeURIComponent(session.pass)}`);
  if (!data.ok){
    showToast('Tu sesión ya no es válida, vuelve a entrar.');
    doLogout();
    return false;
  }
  state = data;
  return true;
}

function hayFormularioActivo(){
  const activeEl = document.activeElement;
  if (!activeEl) return false;
  const tag = activeEl.tagName;
  return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
}

function safeRender(fn, elId){
  try { fn(); }
  catch (e) {
    console.error('Error renderizando ' + fn.name + ':', e);
    const el = elId && document.getElementById(elId);
    if (el) el.innerHTML = `<div class="card"><div class="err">Ha habido un problema mostrando esta pestaña.<br>Detalle: ${String(e && e.message || e)}</div></div>`;
  }
}

async function refreshAndRender(){
  const ok = await loadState();
  if (!ok) return;
  renderTopbar();
  buildTabs();
  safeRender(renderClasificacion, 'tab-clasificacion');
  safeRender(renderHistorial, 'tab-historial');
  safeRender(renderContabilidad, 'tab-contabilidad');
  // no pisamos formularios en los que el usuario esté escribiendo ahora mismo
  if (!hayFormularioActivo()){
    safeRender(renderJornada, 'tab-jornada');
    safeRender(renderSecretaria, 'tab-secretaria');
    safeRender(renderAdmin, 'tab-admin');
  }
}

function startAutoRefresh(){
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => { if (session) refreshAndRender(); }, 12000);
}
function stopAutoRefresh(){
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;
}

function renderTopbar(){
  document.getElementById('me-avatar').textContent = initials(state.me.nombre);
  document.getElementById('me-nombre').textContent = state.me.nombre;
  const roles = [];
  if (state.me.role === 'admin') roles.push('Admin');
  if (state.me.esSecretario) roles.push('Secretario/a');
  if (roles.length === 0) roles.push('Participante');
  document.getElementById('me-role').textContent = roles.join(' · ');
}

function jornadaAbierta(){
  return state.jornadas.find(j => !j.cerrada);
}

function renderJornada(){
  const el = document.getElementById('tab-jornada');
  const j = jornadaAbierta();
  if (!j){
    el.innerHTML = `<div class="card center muted">No hay ninguna jornada abierta ahora mismo.</div>`;
    return;
  }
  const miPred = (j.predicciones||[]).find(p => p.participanteId === state.me.id);
  const p1 = (miPred && miPred.p1 || '').split('-');
  const p2 = (miPred && miPred.p2 || '').split('-');

  const filas = state.participantes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(part => {
    const p = (j.predicciones||[]).find(pr => pr.participanteId === part.id);
    const pagado = j.pagos && j.pagos[part.id];
    return `<tr>
      <td>${part.nombre}</td>
      <td class="num">${p ? (p.p1||'—') : '<span class="pill no">pendiente</span>'}</td>
      <td class="num">${p ? (p.p2||'—') : '—'}</td>
      <td class="num">${pagado ? '<span class="pill ok">pagado</span>' : '<span class="pill no">debe</span>'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent2);"></span><h3>Jornada ${j.numero}</h3></div>
      ${miPred
        ? matchCard(j.partido1, {locked:{local:p1[0],visit:p1[1]}})
        : matchCard(j.partido1, {ids:{local:'p1-local',visit:'p1-visit'}})}
      <div class="divider"></div>
      ${miPred
        ? matchCard(j.partido2, {locked:{local:p2[0],visit:p2[1]}})
        : matchCard(j.partido2, {ids:{local:'p2-local',visit:'p2-visit'}})}
      ${miPred
        ? '<div class="small muted" style="margin-top:12px;text-align:center;">Ya has enviado tu pronóstico. No se puede modificar.</div>'
        : `<div class="err" id="pred-err"></div>
           <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="guardarPronostico('${j.id}')">Guardar mi pronóstico</button>`}
    </div>
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent3);"></span><h3>Pronósticos de la jornada</h3></div>
      <table><thead><tr><th>Quién</th><th class="num">${matchLabel(j.partido1)}</th><th class="num">${matchLabel(j.partido2)}</th><th class="num">Cuota</th></tr></thead><tbody>${filas}</tbody></table>
    </div>
  `;
}

async function guardarPronostico(jornadaId){
  const g = id => document.getElementById(id).value;
  const l1=g('p1-local'), v1=g('p1-visit'), l2=g('p2-local'), v2=g('p2-visit');
  const err = document.getElementById('pred-err');
  if (l1==='' || v1==='' || l2==='' || v2===''){
    err.textContent = 'Rellena los cuatro marcadores.'; return;
  }
  const p1 = `${l1}-${v1}`, p2 = `${l2}-${v2}`;
  const data = await api('/api/predict', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, jornadaId, p1, p2 })
  });
  if (!data.ok){ err.textContent = 'No se pudo guardar (' + data.error + ').'; return; }
  showToast('Pronóstico guardado ✔');
  await refreshAndRender();
}

function renderSecretariaTabla(){
  const sel = document.getElementById('sec-jornada');
  if (!sel) return;
  const j = state.jornadas.find(x => x.id === sel.value) || state.jornadas[0];
  const filas = state.participantes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p => {
    const pagado = !!(j.pagos && j.pagos[p.id]);
    return `<tr>
      <td>${p.nombre}</td>
      <td class="num"><input type="checkbox" class="checkbox" ${pagado?'checked':''} onchange="togglePago('${j.id}','${p.id}',this.checked,this)" /></td>
    </tr>`;
  }).join('');
  document.getElementById('sec-tabla').innerHTML = `<table><thead><tr><th>Participante</th><th class="num">Pagado</th></tr></thead><tbody>${filas}</tbody></table>`;
}

// Los cambios de pago se envían uno detrás de otro (nunca a la vez) para
// que dos clics rápidos no se pisen entre sí en el servidor: eso era lo
// que a veces hacía falta guardar un pago 2 o 3 veces para que quedara.
let pagoQueue = Promise.resolve();

function togglePago(jornadaId, participanteId, pagado, checkboxEl){
  if (checkboxEl) checkboxEl.disabled = true;
  pagoQueue = pagoQueue.then(() => aplicarPago(jornadaId, participanteId, pagado, checkboxEl));
  return pagoQueue;
}

async function aplicarPago(jornadaId, participanteId, pagado, checkboxEl){
  try {
    const data = await api('/api/secretario', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id, pass: session.pass, jornadaId, participanteId, pagado })
    });
    if (!data.ok){
      showToast('No se pudo guardar el pago, inténtalo de nuevo.');
      return;
    }
    // El servidor ya ha confirmado el guardado: actualizamos el pago
    // directamente aquí en vez de volver a pedir todo el estado. Si
    // pidiéramos los datos otra vez justo ahora, a veces el almacenamiento
    // todavía devuelve la versión de un instante antes y parece que el
    // pago "se ha desmarcado solo" cuando en realidad sí se ha guardado.
    const jornadaLocal = (state.jornadas||[]).find(x => x.id === jornadaId);
    if (jornadaLocal) {
      jornadaLocal.pagos = jornadaLocal.pagos || {};
      jornadaLocal.pagos[participanteId] = pagado;
    }
    renderSecretariaTabla();
    safeRender(renderContabilidad, 'tab-contabilidad');
    showToast(pagado ? 'Pago registrado ✔' : 'Pago desmarcado ✔');
  } catch (e) {
    showToast('No se pudo guardar el pago, inténtalo de nuevo.');
  } finally {
    if (checkboxEl) checkboxEl.disabled = false;
  }
}

function calcularContabilidad(){
  const ordenadas = (state.jornadas||[]).slice().sort((a,b)=>a.numero-b.numero);
  let pot = 0;
  const filas = ordenadas.map(j => {
    const pagadas = Object.values(j.pagos||{}).filter(Boolean).length;
    pot += pagadas;
    const ganador = j.cerrada && (j.predicciones||[]).some(p => p.aciertos === 2);
    const boteTrasJornada = pot;
    if (ganador) pot = 0;
    return { jornada: j, pagadas, ganador, boteTrasJornada };
  });
  return { filas, boteActual: pot };
}

function renderContabilidad(){
  const el = document.getElementById('tab-contabilidad');
  if (!el) return;
  if (!(session.esSecretario || session.role === 'admin')) { el.innerHTML=''; return; }
  const { filas, boteActual } = calcularContabilidad();
  const filasHtml = filas.slice().reverse().map(f => `
    <tr>
      <td>Jornada ${f.jornada.numero}${f.jornada.cerrada?'':' <span class="pill no" style="margin-left:4px;">abierta</span>'}</td>
      <td class="num">${f.pagadas} €</td>
      <td class="num">${f.jornada.cerrada ? (f.ganador ? '<span class="pill win">Sí</span>' : '<span class="pill no">No</span>') : '—'}</td>
      <td class="num" style="font-weight:800;">${f.boteTrasJornada} €</td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="card center">
      <div class="section-title" style="justify-content:center;"><span class="dot" style="background:var(--accent2);"></span><h3>Bote acumulado</h3></div>
      <div style="font-size:42px;font-weight:800;color:var(--accent2);margin-top:6px;">${boteActual} €</div>
      <div class="small muted" style="margin-top:6px;">1€ por cada pronóstico pagado. Cuando una jornada cerrada tiene un ganador (2/2), el bote se reparte y vuelve a 0. Si no gana nadie, se acumula para la siguiente.</div>
    </div>
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent3);"></span><h3>Detalle por jornada</h3></div>
      ${filasHtml ? `<table><thead><tr><th>Jornada</th><th class="num">Recaudado</th><th class="num">¿Ganador?</th><th class="num">Bote tras jornada</th></tr></thead><tbody>${filasHtml}</tbody></table>` : '<div class="muted small">Todavía no hay jornadas.</div>'}
    </div>`;
}

      <div class="divider"></div>
      ${matchCard(j.partido2, {ids:{local:`cerrar-${j.id}-l2`,visit:`cerrar-${j.id}-v2`}})}

    </div>`).join('');

  const listaParticipantes = state.participantes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p => `
    <div class="card">
      <div class="row between">
        <div style="font-weight:700;">${p.nombre} <span class="muted small">(${p.id})</span></div>
      </div>
      <div class="row wrap" style="margin-top:10px;">
        <label style="margin:0;"><input type="checkbox" class="checkbox" ${p.role==='admin'?'checked':''} onchange="editarParticipante('${p.id}',{role:this.checked?'admin':'participante'})" /> Admin</label>
        <label style="margin:0;"><input type="checkbox" class="checkbox" ${p.esSecretario?'checked':''} onchange="editarParticipante('${p.id}',{esSecretario:this.checked})" /> Secretario/a</label>
      </div>
      <div class="row" style="margin-top:10px;gap:8px;">
        <button class="btn btn-sm" onclick="resetPassword('${p.id}','${p.nombre.replace(/'/g,"\\'")}')">Restablecer contraseña</button>
        <button class="btn btn-sm btn-danger" onclick="eliminarParticipante('${p.id}','${p.nombre.replace(/'/g,"\\'")}')">Eliminar</button>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--ok);"></span><h3>Copia de seguridad</h3></div>
      <div class="small muted" style="margin-bottom:10px;">Descarga ahora mismo todos los datos (participantes, jornadas, pronósticos y pagos) en un archivo. Guárdalo de vez en cuando por si acaso.</div>
      <a class="btn btn-block" style="display:block;text-align:center;text-decoration:none;" href="/api/backup?id=${encodeURIComponent(session.id)}&pass=${encodeURIComponent(session.pass)}">Descargar copia de seguridad</a>
    </div>
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent2);"></span><h3>Nueva jornada</h3></div>
      <label>Partido 1 · Local</label>
      <select class="input" id="nj-l1">${equiposOptions}</select>
      <label>Partido 1 · Visitante</label>
      <select class="input" id="nj-v1">${equiposOptions}</select>
      <label>Partido 2 · Local</label>
      <select class="input" id="nj-l2">${equiposOptions}</select>
      <label>Partido 2 · Visitante</label>
      <select class="input" id="nj-v2">${equiposOptions}</select>
      <div class="err" id="nj-err"></div>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="crearJornada()">Crear jornada</button>
    </div>
    ${cierres}
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent4);"></span><h3>Pronósticos (meter o corregir a mano)</h3></div>
      <div class="small muted" style="margin-bottom:10px;">Puedes meter o corregir el pronóstico de cualquier participante, aunque ya lo hubiera enviado él mismo o la jornada esté cerrada.</div>
      <label>Jornada</label>
      <select class="input" id="adm-pron-jornada" onchange="renderAdminPronosticoForm()">${state.jornadas.slice().sort((a,b)=>b.numero-a.numero).map(j => `<option value="${j.id}">Jornada ${j.numero}${j.cerrada?' (cerrada)':''}</option>`).join('')}</select>
      <label>Participante</label>
      <select class="input" id="adm-pron-participante" onchange="renderAdminPronosticoForm()">${state.participantes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}</select>
      <div id="adm-pron-form" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <div class="section-title"><span class="dot" style="background:var(--accent3);"></span><h3>Añadir participante</h3></div>
      <label>Nombre</label>

function renderAdminPronosticoForm(){
  const selJ = document.getElementById('adm-pron-jornada');
  const selP = document.getElementById('adm-pron-participante');
  const cont = document.getElementById('adm-pron-form');
  if (!selJ || !selP || !cont) return;
  const j = state.jornadas.find(x => x.id === selJ.value) || state.jornadas[0];
  if (!j) { cont.innerHTML = ''; return; }
  const participanteId = selP.value;
  const pred = (j.predicciones||[]).find(pr => pr.participanteId === participanteId);
  const p1 = ((pred && pred.p1) || '').split('-');
  const p2 = ((pred && pred.p2) || '').split('-');
  cont.innerHTML = `
    ${matchCard(j.partido1, {ids:{local:'adm-pron-l1',visit:'adm-pron-v1'}, vals:{local:p1[0],visit:p1[1]}})}
    <div class="divider"></div>
    ${matchCard(j.partido2, {ids:{local:'adm-pron-l2',visit:'adm-pron-v2'}, vals:{local:p2[0],visit:p2[1]}})}
    <div class="err" id="adm-pron-err"></div>
    <div class="row" style="gap:8px;margin-top:12px;">
      <button class="btn btn-primary" style="flex:1;" onclick="adminGuardarPronostico()">Guardar</button>
      ${pred ? `<button class="btn btn-danger" onclick="adminBorrarPronostico()">Borrar</button>` : ''}
    </div>
  `;
}

async function adminGuardarPronostico(){
  const selJ = document.getElementById('adm-pron-jornada');
  const selP = document.getElementById('adm-pron-participante');
  const g = id => document.getElementById(id).value;
  const err = document.getElementById('adm-pron-err');
  const l1=g('adm-pron-l1'), v1=g('adm-pron-v1'), l2=g('adm-pron-l2'), v2=g('adm-pron-v2');
  if (l1==='' || v1==='' || l2==='' || v2===''){ err.textContent = 'Rellena los cuatro marcadores.'; return; }
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'establecer_pronostico', jornadaId: selJ.value, participanteId: selP.value, p1: `${l1}-${v1}`, p2: `${l2}-${v2}` })
  });
  if (!data.ok){ err.textContent = 'Error: ' + data.error; return; }
  showToast('Pronóstico guardado ✔');
  await refreshAndRender();
}

async function adminBorrarPronostico(){
  const selJ = document.getElementById('adm-pron-jornada');
  const selP = document.getElementById('adm-pron-participante');
  if (!confirm('¿Borrar este pronóstico? La persona podrá volver a enviarlo ella misma.')) return;
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'eliminar_pronostico', jornadaId: selJ.value, participanteId: selP.value })
  });
  if (!data.ok){ showToast('Error: ' + data.error); return; }
  showToast('Pronóstico borrado ✔');
  await refreshAndRender();
}

async function crearJornada(){
  const g = id => document.getElementById(id).value;
  const err = document.getElementById('nj-err');
  const local1=g('nj-l1'), visitante1=g('nj-v1'), local2=g('nj-l2'), visitante2=g('nj-v2');
  if (local1===visitante1 || local2===visitante2){
    err.textContent = 'Local y visitante no pueden ser el mismo equipo.'; return;
  }
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'crear_jornada', local1, visitante1, local2, visitante2 })
  });
  if (!data.ok){ err.textContent = 'Error: ' + data.error; return; }
  showToast('Jornada creada ✔');
  await refreshAndRender();
}

async function cerrarJornada(jornadaId){
  const g = id => document.getElementById(id).value;
  const l1=g(`cerrar-${jornadaId}-l1`), v1=g(`cerrar-${jornadaId}-v1`), l2=g(`cerrar-${jornadaId}-l2`), v2=g(`cerrar-${jornadaId}-v2`);
  if (l1==='' || v1==='' || l2==='' || v2===''){ showToast('Rellena los cuatro resultados.'); return; }
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'cerrar_jornada', jornadaId, resultado1:`${l1}-${v1}`, resultado2:`${l2}-${v2}` })
  });
  if (!data.ok){ showToast('Error: ' + data.error); return; }
  showToast('Jornada cerrada ✔');
  await refreshAndRender();
}

async function crearParticipante(){
  const nombre = document.getElementById('np-nombre').value.trim();
  const err = document.getElementById('np-err');
  if (!nombre){ err.textContent = 'Escribe un nombre.'; return; }
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'crear_participante', nombre })
  });
  if (!data.ok){ err.textContent = 'Error: ' + data.error; return; }
  document.getElementById('np-nombre').value = '';
  showCredModal(nombre, data.id, data.pass);
  await refreshAndRender();
}

async function editarParticipante(participanteId, cambios){
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ id: session.id, pass: session.pass, action:'editar_participante', participanteId }, cambios))
  });
  if (!data.ok){ showToast('Error: ' + data.error); }
  await refreshAndRender();
}

async function eliminarParticipante(participanteId, nombre){
  if (!confirm(`¿Seguro que quieres eliminar a "${nombre}"? Esta acción no se puede deshacer.`)) return;
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'eliminar_participante', participanteId })
  });
  if (!data.ok){
    const mensajes = {
      no_puedes_eliminarte_a_ti_mismo: 'No puedes eliminarte a ti mismo.',
      debe_quedar_un_admin: 'Debe quedar al menos un administrador.',
      participante_no_encontrado: 'Ese participante ya no existe.',
    };
    showToast(mensajes[data.error] || ('Error: ' + data.error));
    return;
  }
  showToast('Participante eliminado ✔');
  await refreshAndRender();
}

async function resetPassword(participanteId, nombre){
  const data = await api('/api/admin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: session.id, pass: session.pass, action:'reset_password', participanteId })
  });
  if (!data.ok){ showToast('Error: ' + data.error); return; }
  showCredModal(nombre, participanteId, data.pass);
}

async function boot(){
  session = getSession();
  if (!session){ return; }
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  await refreshAndRender();
  startAutoRefresh();
}

// cuando se reabre la app (volver de segundo plano, del icono del móvil, etc.)
// refrescamos al momento en vez de esperar al siguiente ciclo
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && session) refreshAndRender();
});
window.addEventListener('pageshow', () => { if (session) refreshAndRender(); });
window.addEventListener('focus', () => { if (session) refreshAndRender(); });

boot();
</script>
